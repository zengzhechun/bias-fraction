<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 980" width="1080" height="980" style="background:#FCFCFE">
<defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d6fb8"></path></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9534f"></path></marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"></path></marker>
    <linearGradient id="g-primary" x1="0" x2="1"><stop offset="0%" stop-color="#2C5F8A"></stop><stop offset="100%" stop-color="#1d6fb8"></stop></linearGradient>
    <linearGradient id="g-secondary" x1="0" x2="1"><stop offset="0%" stop-color="#E08A2B"></stop><stop offset="100%" stop-color="#B8A060"></stop></linearGradient>
  </defs><text x="540" y="26" font-size="17" fill="#1f2d3d" text-anchor="middle">Simulation study: technical roadmap</text><text x="540" y="46" font-size="10.5" fill="#5b6b7b" text-anchor="middle">5 factors × 336 conditions × 1,000 independent replications = 336,000 analyses · Primary: Bland-Altman agreement study (continuous BF) · Secondary: three-zone classification (mixed / bias-dominated / effect-dominated)</text><text x="20" y="78" font-size="11" fill="#1f2d3d" text-anchor="start">① Factor grid (5-factor factorial design): 7 × 6 × 2 × 2 × 2 = 336 conditions · v36 revision: ψ = 0 replaced by ψ = −0.01 (RR = 0.99) to remove the BF = 1 boundary singularity (see eAppendix 2 / 16)</text><rect x="30" y="90" width="170" height="64" rx="6" fill="#2f6fb0"></rect><text x="115" y="112" font-size="11" fill="#fff" text-anchor="middle">True effect ψ</text><text x="115" y="130" font-size="10.5" fill="#fff" text-anchor="middle">7 levels: −0.01, −0.05,</text><text x="115" y="145" font-size="10.5" fill="#fff" text-anchor="middle">−0.10, −0.15, −0.20, −0.30, −0.40</text><rect x="220" y="90" width="170" height="64" rx="6" fill="#2f6fb0"></rect><text x="305" y="112" font-size="11" fill="#fff" text-anchor="middle">Systematic bias μ<tspan baseline-shift="-25%" font-size="9">B</tspan></text><text x="305" y="130" font-size="10.5" fill="#fff" text-anchor="middle">6 levels: −0.05, −0.10,</text><text x="305" y="145" font-size="10.5" fill="#fff" text-anchor="middle">−0.15, −0.20, −0.30, −0.40</text><rect x="410" y="90" width="170" height="64" rx="6" fill="#7fb3e0"></rect><text x="495" y="112" font-size="11" fill="#fff" text-anchor="middle">SE of primary estimate σ<tspan baseline-shift="-25%" font-size="9">ps</tspan></text><text x="495" y="130" font-size="10.5" fill="#fff" text-anchor="middle">2 levels: 0.06, 0.10</text><text x="495" y="145" font-size="10" fill="#fff" text-anchor="middle">(note: σ<tspan baseline-shift="-25%" font-size="9">B</tspan> = 0.05 fixed)</text><rect x="600" y="90" width="170" height="64" rx="6" fill="#7fb3e0"></rect><text x="685" y="112" font-size="11" fill="#fff" text-anchor="middle">Number of controls K</text><text x="685" y="130" font-size="10.5" fill="#fff" text-anchor="middle">2 levels: 12, 25</text><text x="685" y="145" font-size="10.5" fill="#fff" text-anchor="middle">(case K = 12 / large K = 25)</text><rect x="790" y="90" width="260" height="64" rx="6" fill="#e08a2b"></rect><text x="920" y="112" font-size="11" fill="#fff" text-anchor="middle">Bias exchangeability violation</text><text x="920" y="130" font-size="10.5" fill="#fff" text-anchor="middle">2 levels: 0%, 30%</text><text x="920" y="146" font-size="9.3" fill="#fff" text-anchor="middle">(30% controls' bias +0.15)</text><line x1="540" y1="160" x2="540" y2="190" stroke="#5b6b7b" stroke-width="1.6" marker-end="url(#arr-grey)"></line><text x="20" y="208" font-size="12" fill="#1f2d3d" text-anchor="start">② Per-condition data generation: 1,000 independent replications per condition (sample size matches the case study, N = 14,677)</text><rect x="80" y="222" width="180" height="60" rx="6" fill="#fff" stroke="#1f2d3d" stroke-width="1.4"></rect><text x="170" y="242" font-size="11" fill="#1f2d3d" text-anchor="middle">Generate negative-control outcomes</text><text x="170" y="259" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-style="italic">Y<tspan baseline-shift="-25%" font-size="9">jk</tspan> ~ Bernoulli(p<tspan baseline-shift="-25%" font-size="9">0k</tspan>)</text><text x="170" y="275" font-size="10.5" fill="#1f2d3d" text-anchor="middle">K controls, each N = 14,677</text><rect x="320" y="222" width="180" height="60" rx="6" fill="#fff" stroke="#1f2d3d" stroke-width="1.4"></rect><text x="410" y="242" font-size="11" fill="#1f2d3d" text-anchor="middle">Generate primary-outcome data</text><text x="410" y="259" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-style="italic">A | W ~ Bernoulli(g(W))</text><text x="410" y="275" font-size="10.5" fill="#1f2d3d" text-anchor="middle">Y | A, W ~ true ψ + μ<tspan baseline-shift="-25%" font-size="9">B</tspan></text><rect x="560" y="222" width="180" height="60" rx="6" fill="#fff" stroke="#1f2d3d" stroke-width="1.4"></rect><text x="650" y="242" font-size="11" fill="#1f2d3d" text-anchor="middle">SE of the primary estimate</text><text x="650" y="259" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-style="italic">σ<tspan baseline-shift="-25%" font-size="9">ps</tspan> ∈ {0.06, 0.10}</text><text x="650" y="275" font-size="10.5" fill="#1f2d3d" text-anchor="middle">(sampling variability of each ψ̂)</text><rect x="800" y="222" width="200" height="60" rx="6" fill="#fff" stroke="#d9534f" stroke-width="1.4" stroke-dasharray="4 3"></rect><text x="900" y="242" font-size="11" fill="#d9534f" text-anchor="middle">Exchangeability violation injection</text><text x="900" y="259" font-size="10" fill="#d9534f" text-anchor="middle">if exV = 30%: 30% of controls'</text><text x="900" y="275" font-size="10" fill="#d9534f" text-anchor="middle">bias shifted by +0.15 (shared structure violated)</text><line x1="260" y1="252" x2="320" y2="252" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#arr-grey)"></line><line x1="500" y1="252" x2="560" y2="252" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#arr-grey)"></line><line x1="740" y1="252" x2="800" y2="252" stroke="#d9534f" stroke-width="1.4" marker-end="url(#arr-red)"></line><line x1="540" y1="288" x2="540" y2="318" stroke="#5b6b7b" stroke-width="1.6" marker-end="url(#arr-grey)"></line><text x="20" y="336" font-size="12" fill="#1f2d3d" text-anchor="start">③ BF estimation pipeline: executed independently on each simulated dataset, identical to the primary analysis workflow</text><rect x="40" y="350" width="200" height="86" rx="6" fill="#4b3ca7"></rect><text x="140" y="370" font-size="11" fill="#fff" text-anchor="middle">Empirical-null fit</text><text x="140" y="388" font-size="10" fill="#fff" text-anchor="middle">OHDSI EmpiricalCalibration</text><text x="140" y="404" font-size="9.5" fill="#fff" text-anchor="middle">μ̂<tspan baseline-shift="-25%" font-size="9">B</tspan>, σ̂<tspan baseline-shift="-25%" font-size="9">B</tspan> ← K controls' ln(RR)</text><text x="140" y="420" font-size="10" fill="#fff" text-anchor="middle" font-style="italic">μ ~ N(μ̂<tspan baseline-shift="-25%" font-size="9">B</tspan>, σ̂<tspan baseline-shift="-25%" font-size="9">B</tspan>²)</text><rect x="280" y="350" width="180" height="86" rx="6" fill="#2f6fb0"></rect><text x="370" y="370" font-size="11" fill="#fff" text-anchor="middle">Primary effect estimator (TMLE)</text><text x="370" y="388" font-size="10" fill="#fff" text-anchor="middle">TMLE + SuperLearner</text><text x="370" y="404" font-size="10" fill="#fff" text-anchor="middle" font-style="italic">ln(RR̂) ± 1.96 · SE</text><text x="370" y="420" font-size="9" fill="#fff" text-anchor="middle">(doubly robust, semiparametric efficient)</text><rect x="500" y="350" width="200" height="86" rx="6" fill="#2f6fb0"></rect><text x="600" y="370" font-size="11" fill="#fff" text-anchor="middle">BF computation (bounded [0, 1] scale)</text><text x="600" y="388" font-size="9.5" fill="#fff" text-anchor="middle" font-style="italic">BF = |μ<tspan baseline-shift="-25%" font-size="9">B</tspan>| / (|μ<tspan baseline-shift="-25%" font-size="9">B</tspan>| + |ψ̃|)</text><text x="600" y="406" font-size="10" fill="#fff" text-anchor="middle">MC: empirical-null sampling → BF̂</text><text x="600" y="422" font-size="10" fill="#fff" text-anchor="middle">MCMC: posterior sampling → BF̂ + 95% CrI</text><rect x="740" y="350" width="280" height="86" rx="6" fill="#1f2d3d"></rect><text x="880" y="370" font-size="11" fill="#fff" text-anchor="middle">Three-zone classification (secondary)</text><text x="880" y="388" font-size="10" fill="#fff" text-anchor="middle">BF &gt; 0.5 bias-dominated</text><text x="880" y="404" font-size="10" fill="#fff" text-anchor="middle">1/3 ≤ BF ≤ 0.5 mixed zone</text><text x="880" y="420" font-size="9.5" fill="#fff" text-anchor="middle">BF &lt; 1/3 effect-dominated (alongside OHDSI cal. p)</text><line x1="240" y1="393" x2="280" y2="393" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#arr-grey)"></line><line x1="460" y1="393" x2="500" y2="393" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#arr-grey)"></line><line x1="700" y1="393" x2="740" y2="393" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#arr-grey)"></line><line x1="540" y1="442" x2="540" y2="472" stroke="#5b6b7b" stroke-width="1.6" marker-end="url(#arr-grey)"></line><text x="20" y="490" font-size="12" fill="#1f2d3d" text-anchor="start">④ Evaluation: parallel reporting of primary and secondary analyses</text><rect x="30" y="504" width="500" height="280" rx="6" fill="url(#g-primary)"></rect><text x="280" y="528" font-size="14" fill="#fff" text-anchor="middle">Primary analysis: Bland-Altman agreement study</text><text x="280" y="544" font-size="10.2" fill="#EEF3FB" text-anchor="middle">true BF on x-axis, BF̂ − BF_true on y-axis; interior excludes boundary</text><rect x="50" y="558" width="220" height="80" rx="6" fill="#fff" opacity="0.16"></rect><text x="160" y="576" font-size="11" fill="#fff" text-anchor="middle">interior panel</text><text x="160" y="592" font-size="9.3" fill="#fff" text-anchor="middle">excludes the near-BF = 1 boundary (ψ = −0.01)</text><text x="160" y="608" font-size="9.3" fill="#fff" text-anchor="middle">11 BA statistics per condition</text><text x="160" y="624" font-size="9.3" fill="#fff" text-anchor="middle">BF near-unbiased away from boundary</text><rect x="290" y="558" width="220" height="80" rx="6" fill="#fff" opacity="0.16"></rect><text x="400" y="576" font-size="11" fill="#fff" text-anchor="middle">full panel</text><text x="400" y="592" font-size="9.3" fill="#fff" text-anchor="middle">all 336 conditions included</text><text x="400" y="608" font-size="9.3" fill="#fff" text-anchor="middle">BF is a bounded quantity; near the</text><text x="400" y="624" font-size="9.3" fill="#fff" text-anchor="middle">boundary shows a structural ceiling</text><rect x="50" y="650" width="460" height="120" rx="6" fill="#fff" opacity="0.12"></rect><text x="60" y="670" font-size="11" fill="#fff" text-anchor="start">11 BA statistics:</text><text x="60" y="688" font-size="9.3" fill="#fff" text-anchor="start">① mean bias · ② SD(diff) · ③ LoA lower · ④ LoA upper · ⑤ within-LoA% · ⑥ CCC</text><text x="60" y="706" font-size="9.3" fill="#fff" text-anchor="start">⑦ proportional bias r · ⑧ slope [95% CI] · ⑨ slope t and p · ⑩ intercept · ⑪ intercept t and p</text><text x="60" y="724" font-size="9.3" fill="#fff" text-anchor="start">Combined with the 3D interactive plot (figJ) and the logit-boundary sensitivity analysis (trim / full)</text><text x="60" y="744" font-size="9" fill="#FFD9A0" text-anchor="start" font-style="italic">Statistically significant proportional bias does not equate to clinically meaningful bias; away from BF = 1, BF is near-unbiased</text><rect x="550" y="504" width="500" height="280" rx="6" fill="url(#g-secondary)"></rect><text x="800" y="528" font-size="14" fill="#fff" text-anchor="middle">Secondary analysis: three-zone classification accuracy</text><text x="800" y="544" font-size="10.2" fill="#FFF8E8" text-anchor="middle">actionable interpretive interface for binary clinical decisions</text><rect x="570" y="558" width="460" height="80" rx="6" fill="#fff" opacity="0.18"></rect><text x="800" y="576" font-size="11" fill="#fff" text-anchor="middle">Three-zone point-estimate accuracy (%)</text><text x="800" y="592" font-size="9.3" fill="#fff" text-anchor="middle">bias-dominated / mixed / effect-dominated</text><text x="800" y="608" font-size="9.3" fill="#fff" text-anchor="middle">overall accuracy exceeds the chance-level (33.3%)</text><text x="800" y="624" font-size="9.3" fill="#fff" text-anchor="middle" font-style="italic">(values reported in Results §⑦ and Table 1)</text><rect x="570" y="650" width="460" height="120" rx="6" fill="#fff" opacity="0.12"></rect><text x="580" y="670" font-size="11" fill="#fff" text-anchor="start">CI selective rule (selective classifier):</text><text x="580" y="688" font-size="9.3" fill="#fff" text-anchor="start">declare only if the 95% CI lies wholly within a zone</text><text x="580" y="706" font-size="9.3" fill="#fff" text-anchor="start">raises decision accuracy on a subset of conditions</text><text x="580" y="724" font-size="9.3" fill="#fff" text-anchor="start">otherwise assign the mixed zone (insufficient evidence)</text><text x="580" y="744" font-size="9" fill="#FFE6B0" text-anchor="start" font-style="italic">Retained as secondary: three-zone + CI rule is more clinically actionable than BA alone</text><text x="20" y="802" font-size="12" fill="#1f2d3d" text-anchor="start">⑤ Output deliverables (graphics / data / manuscript)</text><rect x="30" y="816" width="230" height="60" rx="6" fill="#F4F6FB" stroke="#1d6fb8" stroke-width="1.2"></rect><text x="145" y="836" font-size="11" fill="#1d6fb8" text-anchor="middle">Primary graphic outputs</text><text x="145" y="854" font-size="10" fill="#1f2d3d" text-anchor="middle">figL interior BA / figH calibration scatter</text><text x="145" y="870" font-size="10" fill="#1f2d3d" text-anchor="middle">figJ 3D interactive / figK trim</text><rect x="280" y="816" width="230" height="60" rx="6" fill="#F4F6FB" stroke="#1d6fb8" stroke-width="1.2"></rect><text x="395" y="836" font-size="11" fill="#1d6fb8" text-anchor="middle">Data deliverables</text><text x="395" y="854" font-size="10" fill="#1f2d3d" text-anchor="middle">bland_altman_stats.csv</text><text x="395" y="870" font-size="10" fill="#1f2d3d" text-anchor="middle">per_condition_summary.csv</text><rect x="530" y="816" width="230" height="60" rx="6" fill="#FFF8E8" stroke="#E08A2B" stroke-width="1.2"></rect><text x="645" y="836" font-size="11" fill="#E08A2B" text-anchor="middle">Secondary graphic outputs</text><text x="645" y="854" font-size="10" fill="#1f2d3d" text-anchor="middle">zoneBar / biasBar / heatmap</text><text x="645" y="870" font-size="10" fill="#1f2d3d" text-anchor="middle">OHDSI calibration / naive reference</text><rect x="780" y="816" width="270" height="60" rx="6" fill="#FBF9FE" stroke="#2C2C2C" stroke-width="1.2"></rect><text x="915" y="836" font-size="11" fill="#1f2d3d" text-anchor="middle">Manuscript / interactive explainer</text><text x="915" y="854" font-size="10" fill="#1f2d3d" text-anchor="middle">manuscript_v36.docx · eAppendix 16</text><text x="915" y="870" font-size="10" fill="#1f2d3d" text-anchor="middle">explainer §⑦ (primary) + §⑨ (secondary)</text><rect x="30" y="898" width="1020" height="68" rx="6" fill="#F8F9FB" stroke="#d6e2ee"></rect><text x="50" y="920" font-size="11.5" fill="#1f2d3d" text-anchor="start" font-weight="700">Summary</text><text x="50" y="940" font-size="10.2" fill="#1f2d3d" text-anchor="start">A 5-factor factorial design yields 336 evaluation scenarios with known ground truth; 1,000 independent replications per scenario; processed through the complete TMLE + SuperLearner + empirical-null + BF pipeline;</text><text x="50" y="956" font-size="9.8" fill="#1d6fb8" text-anchor="start">primary analysis: Bland-Altman agreement study of BF as a continuous estimator; secondary analysis: three-zone classification with a CI selective rule for clinical decisions.</text>
</svg>