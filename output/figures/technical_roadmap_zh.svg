<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 980" width="1080" height="980" style="background:#FCFCFE">
<defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d6fb8"></path></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9534f"></path></marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"></path></marker>
    <linearGradient id="g-primary" x1="0" x2="1"><stop offset="0%" stop-color="#2C5F8A"></stop><stop offset="100%" stop-color="#1d6fb8"></stop></linearGradient>
    <linearGradient id="g-secondary" x1="0" x2="1"><stop offset="0%" stop-color="#E08A2B"></stop><stop offset="100%" stop-color="#B8A060"></stop></linearGradient>
  </defs><text x="540" y="26" font-size="17" fill="#1f2d3d" text-anchor="middle">模拟研究技术路线图</text><text x="540" y="46" font-size="10.5" fill="#5b6b7b" text-anchor="middle">5 因子 × 336 个条件 × 1,000 次独立重复 = 336,000 次分析 · 主分析：Bland-Altman 一致性研究（连续 BF 估计器） · 辅助分析：三区分类（混合 / 偏倚主导 / 效应主导）</text><text x="20" y="78" font-size="11" fill="#1f2d3d" text-anchor="start">① 因子网格（5 因子析因设计）：7 × 6 × 2 × 2 × 2 = 336 个条件 · v36 修订：ψ = 0 替换为 ψ = −0.01（RR = 0.99）以消除 BF = 1 边界奇点（见 eAppendix 2 / 16）</text><rect x="30" y="90" width="170" height="64" rx="6" fill="#2f6fb0"></rect><text x="115" y="112" font-size="11" fill="#fff" text-anchor="middle">ψ 真实效应</text><text x="115" y="130" font-size="10.5" fill="#fff" text-anchor="middle">7 个水平：−0.01, −0.05,</text><text x="115" y="145" font-size="10.5" fill="#fff" text-anchor="middle">−0.10, −0.15, −0.20, −0.30, −0.40</text><rect x="220" y="90" width="170" height="64" rx="6" fill="#2f6fb0"></rect><text x="305" y="112" font-size="11" fill="#fff" text-anchor="middle">μ<tspan baseline-shift="-25%" font-size="9">B</tspan> 系统偏倚均值</text><text x="305" y="130" font-size="10.5" fill="#fff" text-anchor="middle">6 个水平：−0.05, −0.10,</text><text x="305" y="145" font-size="10.5" fill="#fff" text-anchor="middle">−0.15, −0.20, −0.30, −0.40</text><rect x="410" y="90" width="170" height="64" rx="6" fill="#7fb3e0"></rect><text x="495" y="112" font-size="11" fill="#fff" text-anchor="middle">σ<tspan baseline-shift="-25%" font-size="9">ps</tspan> 主效应估计标准误</text><text x="495" y="130" font-size="10.5" fill="#fff" text-anchor="middle">2 个水平：0.06, 0.10</text><text x="495" y="145" font-size="10" fill="#fff" text-anchor="middle">（注：σ<tspan baseline-shift="-25%" font-size="9">B</tspan> = 0.05 固定）</text><rect x="600" y="90" width="170" height="64" rx="6" fill="#7fb3e0"></rect><text x="685" y="112" font-size="11" fill="#fff" text-anchor="middle">K 阴性对照数</text><text x="685" y="130" font-size="10.5" fill="#fff" text-anchor="middle">2 个水平：12, 25</text><text x="685" y="145" font-size="10.5" fill="#fff" text-anchor="middle">（案例 K = 12 / 大样本 K = 25）</text><rect x="790" y="90" width="260" height="64" rx="6" fill="#e08a2b"></rect><text x="920" y="112" font-size="11" fill="#fff" text-anchor="middle">偏倚交换性违反</text><text x="920" y="130" font-size="10.5" fill="#fff" text-anchor="middle">2 个水平：0%, 30%</text><text x="920" y="146" font-size="9.3" fill="#fff" text-anchor="middle">（30% 对照偏倚 +0.15，违背共享结构）</text><line x1="540" y1="160" x2="540" y2="190" stroke="#5b6b7b" stroke-width="1.6" marker-end="url(#arr-grey)"></line><text x="20" y="208" font-size="12" fill="#1f2d3d" text-anchor="start">② 单条件数据生成：每条件 1,000 次独立重复（样本量与案例研究一致，N = 14,677）</text><rect x="80" y="222" width="180" height="60" rx="6" fill="#fff" stroke="#1f2d3d" stroke-width="1.4"></rect><text x="170" y="242" font-size="11" fill="#1f2d3d" text-anchor="middle">生成阴性对照结局</text><text x="170" y="259" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-style="italic">Y<tspan baseline-shift="-25%" font-size="9">jk</tspan> ~ Bernoulli(p<tspan baseline-shift="-25%" font-size="9">0k</tspan>)</text><text x="170" y="275" font-size="10.5" fill="#1f2d3d" text-anchor="middle">K 个对照，每对照 N = 14,677</text><rect x="320" y="222" width="180" height="60" rx="6" fill="#fff" stroke="#1f2d3d" stroke-width="1.4"></rect><text x="410" y="242" font-size="11" fill="#1f2d3d" text-anchor="middle">生成主结局观测数据</text><text x="410" y="259" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-style="italic">A | W ~ Bernoulli(g(W))</text><text x="410" y="275" font-size="10.5" fill="#1f2d3d" text-anchor="middle">Y | A, W ~ 真值 ψ + μ<tspan baseline-shift="-25%" font-size="9">B</tspan></text><rect x="560" y="222" width="180" height="60" rx="6" fill="#fff" stroke="#1f2d3d" stroke-width="1.4"></rect><text x="650" y="242" font-size="11" fill="#1f2d3d" text-anchor="middle">主估计的标准误</text><text x="650" y="259" font-size="10.5" fill="#1f2d3d" text-anchor="middle" font-style="italic">σ<tspan baseline-shift="-25%" font-size="9">ps</tspan> ∈ {0.06, 0.10}</text><text x="650" y="275" font-size="10.5" fill="#1f2d3d" text-anchor="middle">（每个 ψ̂ 自身的抽样变异）</text><rect x="800" y="222" width="200" height="60" rx="6" fill="#fff" stroke="#d9534f" stroke-width="1.4" stroke-dasharray="4 3"></rect><text x="900" y="242" font-size="11" fill="#d9534f" text-anchor="middle">交换性违反注入</text><text x="900" y="259" font-size="10" fill="#d9534f" text-anchor="middle">若 exV = 30%：30% 对照的</text><text x="900" y="275" font-size="10" fill="#d9534f" text-anchor="middle">偏倚被平移 +0.15（违背共享结构）</text><line x1="260" y1="252" x2="320" y2="252" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#arr-grey)"></line><line x1="500" y1="252" x2="560" y2="252" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#arr-grey)"></line><line x1="740" y1="252" x2="800" y2="252" stroke="#d9534f" stroke-width="1.4" marker-end="url(#arr-red)"></line><line x1="540" y1="288" x2="540" y2="318" stroke="#5b6b7b" stroke-width="1.6" marker-end="url(#arr-grey)"></line><text x="20" y="336" font-size="12" fill="#1f2d3d" text-anchor="start">③ BF 估计管线：对每条仿真数据独立执行，与正式分析流程完全一致</text><rect x="40" y="350" width="200" height="86" rx="6" fill="#4b3ca7"></rect><text x="140" y="370" font-size="11" fill="#fff" text-anchor="middle">经验零拟合</text><text x="140" y="388" font-size="10" fill="#fff" text-anchor="middle">OHDSI EmpiricalCalibration</text><text x="140" y="404" font-size="9.5" fill="#fff" text-anchor="middle">μ̂<tspan baseline-shift="-25%" font-size="9">B</tspan>, σ̂<tspan baseline-shift="-25%" font-size="9">B</tspan> ← K 个对照的 ln(RR)</text><text x="140" y="420" font-size="10" fill="#fff" text-anchor="middle" font-style="italic">μ ~ N(μ̂<tspan baseline-shift="-25%" font-size="9">B</tspan>, σ̂<tspan baseline-shift="-25%" font-size="9">B</tspan>²)</text><rect x="280" y="350" width="180" height="86" rx="6" fill="#2f6fb0"></rect><text x="370" y="370" font-size="11" fill="#fff" text-anchor="middle">主效应估计（TMLE）</text><text x="370" y="388" font-size="10" fill="#fff" text-anchor="middle">TMLE + SuperLearner</text><text x="370" y="404" font-size="10" fill="#fff" text-anchor="middle" font-style="italic">ln(RR̂) ± 1.96 · SE</text><text x="370" y="420" font-size="9" fill="#fff" text-anchor="middle">（双重稳健 + 半参数有效）</text><rect x="500" y="350" width="200" height="86" rx="6" fill="#2f6fb0"></rect><text x="600" y="370" font-size="11" fill="#fff" text-anchor="middle">BF 计算（有界 [0, 1] 尺度）</text><text x="600" y="388" font-size="9.5" fill="#fff" text-anchor="middle" font-style="italic">BF = |μ<tspan baseline-shift="-25%" font-size="9">B</tspan>| / (|μ<tspan baseline-shift="-25%" font-size="9">B</tspan>| + |ψ̃|)</text><text x="600" y="406" font-size="10" fill="#fff" text-anchor="middle">MC：经验零抽样 → BF̂</text><text x="600" y="422" font-size="10" fill="#fff" text-anchor="middle">MCMC：后验抽样 → BF̂ + 95% CrI</text><rect x="740" y="350" width="280" height="86" rx="6" fill="#1f2d3d"></rect><text x="880" y="370" font-size="11" fill="#fff" text-anchor="middle">三区分类（辅助分析）</text><text x="880" y="388" font-size="10" fill="#fff" text-anchor="middle">BF &gt; 0.5 偏倚主导区</text><text x="880" y="404" font-size="10" fill="#fff" text-anchor="middle">1/3 ≤ BF ≤ 0.5 混合区</text><text x="880" y="420" font-size="9.5" fill="#fff" text-anchor="middle">BF &lt; 1/3 效应主导区（与 OHDSI 校准 p 并列）</text><line x1="240" y1="393" x2="280" y2="393" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#arr-grey)"></line><line x1="460" y1="393" x2="500" y2="393" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#arr-grey)"></line><line x1="700" y1="393" x2="740" y2="393" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#arr-grey)"></line><line x1="540" y1="442" x2="540" y2="472" stroke="#5b6b7b" stroke-width="1.6" marker-end="url(#arr-grey)"></line><text x="20" y="490" font-size="12" fill="#1f2d3d" text-anchor="start">④ 评估：主分析与辅助分析并列报告</text><rect x="30" y="504" width="500" height="280" rx="6" fill="url(#g-primary)"></rect><text x="280" y="528" font-size="14" fill="#fff" text-anchor="middle">主分析：Bland-Altman 一致性研究</text><text x="280" y="544" font-size="10.2" fill="#EEF3FB" text-anchor="middle">以真实 BF 为横轴、BF̂ − BF_true 为纵轴；interior 排除近边界、full 含全部</text><rect x="50" y="558" width="220" height="80" rx="6" fill="#fff" opacity="0.16"></rect><text x="160" y="576" font-size="11" fill="#fff" text-anchor="middle">interior 面板</text><text x="160" y="592" font-size="9.3" fill="#fff" text-anchor="middle">剔除近 BF = 1 边界（ψ = −0.01）</text><text x="160" y="608" font-size="9.3" fill="#fff" text-anchor="middle">逐条件报告 11 项 BA 统计量</text><text x="160" y="624" font-size="9.3" fill="#fff" text-anchor="middle">BF 在边界外近似无偏</text><rect x="290" y="558" width="220" height="80" rx="6" fill="#fff" opacity="0.16"></rect><text x="400" y="576" font-size="11" fill="#fff" text-anchor="middle">full 面板</text><text x="400" y="592" font-size="9.3" fill="#fff" text-anchor="middle">含全部 336 个条件</text><text x="400" y="608" font-size="9.3" fill="#fff" text-anchor="middle">BF 为有界量；近边界处存在</text><text x="400" y="624" font-size="9.3" fill="#fff" text-anchor="middle">结构性天花板效应（见 eAppendix 16）</text><rect x="50" y="650" width="460" height="120" rx="6" fill="#fff" opacity="0.12"></rect><text x="60" y="670" font-size="11" fill="#fff" text-anchor="start">11 项 BA 统计量：</text><text x="60" y="688" font-size="9.3" fill="#fff" text-anchor="start">① 均值偏倚 · ② SD(diff) · ③ LoA 下界 · ④ LoA 上界 · ⑤ within-LoA% · ⑥ CCC</text><text x="60" y="706" font-size="9.3" fill="#fff" text-anchor="start">⑦ 比例偏倚 r · ⑧ 回归斜率 [95% CI] · ⑨ 斜率 t 与 p · ⑩ 截距 · ⑪ 截距 t 与 p</text><text x="60" y="724" font-size="9.3" fill="#fff" text-anchor="start">配合 3D 交互图（figJ）与 logit 边界敏感性分析（trim / full）</text><text x="60" y="744" font-size="9" fill="#FFD9A0" text-anchor="start" font-style="italic">统计显著的比例偏倚并不等同于临床有意义的偏倚；BF = 1 边界之外，BF 仍近似无偏</text><rect x="550" y="504" width="500" height="280" rx="6" fill="url(#g-secondary)"></rect><text x="800" y="528" font-size="14" fill="#fff" text-anchor="middle">辅助分析：三区分类准确率</text><text x="800" y="544" font-size="10.2" fill="#FFF8E8" text-anchor="middle">为需要二元分类决策的临床应用提供可操作的判读界面</text><rect x="570" y="558" width="460" height="80" rx="6" fill="#fff" opacity="0.18"></rect><text x="800" y="576" font-size="11" fill="#fff" text-anchor="middle">三区点估计准确率（%）</text><text x="800" y="592" font-size="9.3" fill="#fff" text-anchor="middle">偏倚主导 / 混合 / 效应主导</text><text x="800" y="608" font-size="9.3" fill="#fff" text-anchor="middle">总体准确率高于随机猜测水平（33.3%）</text><text x="800" y="624" font-size="9.3" fill="#fff" text-anchor="middle" font-style="italic">（具体数值见 Results §⑦ 与 Table 1）</text><rect x="570" y="650" width="460" height="120" rx="6" fill="#fff" opacity="0.12"></rect><text x="580" y="670" font-size="11" fill="#fff" text-anchor="start">CI 选择性规则（selective classifier）：</text><text x="580" y="688" font-size="9.3" fill="#fff" text-anchor="start">仅在 95% CI 完全落入某区时作出判定</text><text x="580" y="706" font-size="9.3" fill="#fff" text-anchor="start">在部分条件子集上提升判定准确率</text><text x="580" y="724" font-size="9.3" fill="#fff" text-anchor="start">其余情形判为混合区（证据不足以区分）</text><text x="580" y="744" font-size="9" fill="#FFE6B0" text-anchor="start" font-style="italic">保留为辅助分析：三区 + CI 规则比纯连续 BA 更具临床可操作性</text><text x="20" y="802" font-size="12" fill="#1f2d3d" text-anchor="start">⑤ 输出物（图形 / 数据 / 文本）</text><rect x="30" y="816" width="230" height="60" rx="6" fill="#F4F6FB" stroke="#1d6fb8" stroke-width="1.2"></rect><text x="145" y="836" font-size="11" fill="#1d6fb8" text-anchor="middle">主分析图形</text><text x="145" y="854" font-size="10" fill="#1f2d3d" text-anchor="middle">figL interior BA / figH 校准散点</text><text x="145" y="870" font-size="10" fill="#1f2d3d" text-anchor="middle">figJ 3D 交互图 / figK trim</text><rect x="280" y="816" width="230" height="60" rx="6" fill="#F4F6FB" stroke="#1d6fb8" stroke-width="1.2"></rect><text x="395" y="836" font-size="11" fill="#1d6fb8" text-anchor="middle">数据文件</text><text x="395" y="854" font-size="10" fill="#1f2d3d" text-anchor="middle">bland_altman_stats.csv</text><text x="395" y="870" font-size="10" fill="#1f2d3d" text-anchor="middle">per_condition_summary.csv</text><rect x="530" y="816" width="230" height="60" rx="6" fill="#FFF8E8" stroke="#E08A2B" stroke-width="1.2"></rect><text x="645" y="836" font-size="11" fill="#E08A2B" text-anchor="middle">辅助分析图形</text><text x="645" y="854" font-size="10" fill="#1f2d3d" text-anchor="middle">zoneBar / biasBar / 热图</text><text x="645" y="870" font-size="10" fill="#1f2d3d" text-anchor="middle">OHDSI 校准 / naive 对照</text><rect x="780" y="816" width="270" height="60" rx="6" fill="#FBF9FE" stroke="#2C2C2C" stroke-width="1.2"></rect><text x="915" y="836" font-size="11" fill="#1f2d3d" text-anchor="middle">论文 / 互动讲解器</text><text x="915" y="854" font-size="10" fill="#1f2d3d" text-anchor="middle">manuscript_v36.docx · eAppendix 16</text><text x="915" y="870" font-size="10" fill="#1f2d3d" text-anchor="middle">讲解器 §⑦（主）+ §⑨（辅助）</text><rect x="30" y="898" width="1020" height="68" rx="6" fill="#F8F9FB" stroke="#d6e2ee"></rect><text x="50" y="920" font-size="11.5" fill="#1f2d3d" text-anchor="start" font-weight="700">概要 Summary</text><text x="50" y="940" font-size="10.2" fill="#1f2d3d" text-anchor="start">5 因子析因设计生成 336 个已知真值的评估场景；每场景 1,000 次独立重复；经完整 TMLE + SuperLearner + 经验零 + BF 估计管线处理；</text><text x="50" y="956" font-size="9.8" fill="#1d6fb8" text-anchor="start">主分析采用 Bland-Altman 一致性研究评价 BF 作为连续估计器的精度；辅助分析采用三区分类与 CI 选择性规则为临床决策提供可操作的判读界面。</text>
</svg>