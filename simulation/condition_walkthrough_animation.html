<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>单条件 200 次重复抽样 · 单步动画演示</title>
<style>
  :root{
    --bg:#f5f9fd; --panel:#ffffff; --ink:#1f2d3d; --muted:#5b6b7b;
    --line:#d6e2ee; --blue:#2f6fb0; --blue2:#7fb3e0; --orange:#e08a2b;
    --red:#d9534f; --green:#2e9e6b; --yellow:#e6b800; --accent:#1d6fb8;
    --indigo:#4b3ca7; --brown:#8b5a2b; --ink-2:#1f2d3d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    font-size:14px;line-height:1.55}
  .wrap{max-width:980px;margin:0 auto;padding:22px 18px 48px}
  h1{font-size:20px;margin:0 0 4px;color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:5px 12px;font-size:12.5px}
  .chip b{color:var(--accent)}
  .chip.primary{background:#eaf2fb;border-color:var(--accent)}
  .chip.primary b{color:var(--accent)}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px;box-shadow:0 1px 3px rgba(20,50,90,.06)}
  svg{display:block;width:100%;height:auto;background:#fbfdff;border-radius:8px}
  .step-txt{min-height:74px;font-size:14px;color:var(--ink);margin-top:10px}
  .step-txt .k{color:var(--accent);font-weight:600}
  .controls{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;
    font-size:13.5px;cursor:pointer;transition:filter .15s}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:#eaf2fb;color:var(--accent)}
  .dots{display:flex;gap:6px;margin-left:auto}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--accent)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .axis-t{font-size:11px;fill:var(--muted)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pop{animation:pop .5s ease both}
  .foot{color:var(--muted);font-size:12px;margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>一个条件如何抽出 200 个样本</h1>
  <div class="sub">条件: ψ=−0.30, μ_B=−0.20, σ_B=0.05, K=12, 交互性违反=30% · 真实落点 <b>BF=0.40 → 黄区 (competitive)</b></div>
  <div class="chips" id="chips"></div>

  <div class="stage">
    <svg id="cv" viewBox="0 0 620 410" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="step-txt" id="stepTxt"></div>
    <div class="legend">
      <span><i style="background:var(--blue)"></i>干净负对照 (均值 μ_B=−0.20)</span>
      <span><i style="background:var(--orange)"></i>被违反负对照 (均值 μ_B+0.15=−0.05)</span>
      <span><i style="background:var(--indigo)"></i>主研究观测 obs</span>
      <span><i style="background:var(--brown)"></i>经验零均值 μ_b (拟合)</span>
    </div>
    <div class="controls">
      <button class="ghost" id="prev">上一步</button>
      <button id="next">下一步</button>
      <button class="ghost" id="play">▶ 自动播放</button>
      <button class="ghost" id="reset">重置</button>
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

  {t:"第 1 步 · 抽 12 个负对照", d:"每个负对照的观测效应 <span class='mono'>nc_log_rr ~ N(其均值, σ_B=0.05)</span>。前 8 个均值=−0.20 (蓝, 干净), 后 4 个均值=−0.05 (橙, 被违反)。每条横线是该对照的标准误 nc_se。这就是「样本数据框」的 12 行。"},
  {t:"第 2 步 · 拟合经验零分布 fitNull", d:"用 12 个负对照拟合高斯, 得到经验零均值 <span class='k'>μ_b</span> 与离散度 σ_b。本轮回合 μ_b=−0.1506, 比真值 −0.20 <b>偏高</b>, 因为 4 个被违反对照(橙)把分布往右拉了。这正是「交互性违反」的污染源。"},
  {t:"第 3 步 · 抽主研究观测", d:"主研究观测 <span class='mono'>obs = ψ + μ_B + N(0, 0.06) = −0.50 + 噪声</span>。本轮回合 obs=−0.4494 (紫点)。注意 obs − μ_B(真实) = −0.30 = ψ, 即去偏后的真实效应。"},
  {t:"第 4 步 · 算 BF 并分类", d:"BF_est = |μ_b|/(|μ_b|+|obs−μ_b|) = 0.1506/0.4494 = <span class='k'>0.335</span>。介于 1/3 与 0.5 之间, 落在黄区 (competitive)。本轮回合碰巧判对, 但 μ_b 被污染会让很多回合误判为绿区。"},
  {t:"第 5 步 · 重复 200 次并汇总", d:"把 200 个 BF_est 画成直方图 (绿=BF&lt;1/3, 黄=1/3~0.5, 红=BF&gt;0.5)。真值在黄区, 但点估计大量落在绿区 (73.5%), 只有 26.5% 落在黄区。<span class='k'>这正是黄区准确率只有 ~42% 的由来</span>: 不是分界线位置问题, 而是 μ_b 估计方差 + 违反污染的内在极限。正确对策是 v35 的 bootstrap CI 选择性规则 (保守弃权)。"}
];
let step=0, timer=null;

function chipsHTML(){
  // BF_true 高亮为主指标, BER 作为辅助
  return [
    {p:`ψ=<b>${P.psi}</b>`},
    {p:`μ_B=<b>${P.muB}</b>`},
    {p:`σ_B=<b>${P.sigmaB}</b>`},
    {p:`K=<b>${P.K}</b>`},
    {p:`违反=<b>${P.exV}</b>`},
    {p:`BF_true=<b>${P.bf_true}</b>`, pri:true},
    {p:`BER_true=<b>${P.bsr_true}</b>`},
    {p:`种子=<b>${P.cond_seed}</b>`}
  ].map(c=>`<span class="chip ${c.pri?'primary':''}">${c.p}</span>`).join("");
}

function clear(){while(cv.firstChild)cv.removeChild(cv.firstChild);}

// 步骤 0: 静态条件卡 (BF 为主)
function render0(){
  clear();
  const g=el("g",{}); cv.appendChild(g);
  g.appendChild(txt(300,40,"该条件的固定因子与唯一真值 (BF)",null,"middle"));
  const rows=[
    ["主研究真实效应 ψ", P.psi],
    ["真实系统偏倚 μ_B", P.muB],
    ["负对照离散度 σ_B", P.sigmaB],
    ["负对照个数 K", P.K],
    ["交互性违反比例", P.exV+" (→ "+((P.K*P.exV).toFixed(0))+" 个被违反)"],
    ["BF_true = |μ_B|/(|μ_B|+|ψ|)", P.bf_true+"  →  黄区 (主指标)"],
    ["BER_true = |μ_B|/|ψ|  (辅助)", P.bsr_true+" (= BF/(1−BF))"],
    ["条件种子 cond_seed", P.cond_seed+" (保证可复现)"]
  ];
  let y=78;
  rows.forEach(r=>{
    g.appendChild(txt(150,y,r[0],null,"end"));
    g.appendChild(txt(170,y,String(r[1]),"", "start"));
    y+=28;
  });
  g.appendChild(el("rect",{x:430,y:62,width:140,height:170,rx:10,fill:"#fff7da",stroke:"#e6b800"}));
  g.appendChild(txt(500,88,"真值落点 (BF)",null,"middle"));
  g.appendChild(txt(500,120,"BF = 0.40",null,"middle"));
  g.appendChild(txt(500,150,"黄区 competitive",null,"middle"));
  g.appendChild(txt(500,182,"介于 1/3 与 0.5",null,"middle"));
  g.appendChild(txt(500,208,"最难判断的区间",null,"middle"));
}

// 通用: 画数值横轴
function drawAxis(d0,d1,y,label){
  const x=scale(d0,d1,50,560);
  cv.appendChild(el("line",{x1:50,y1:y,x2:560,y2:y,stroke:"#9fb4c7"}));
  for(let v=Math.ceil(d0*20)/20; v<=d1+1e-9; v+=0.05){
    const px=x(v); cv.appendChild(el("line",{x1:px,y1:y-4,x2:px,y2:y+4,stroke:"#9fb4c7"}));
    cv.appendChild(txt(px,y+16,v.toFixed(2),"axis-t","middle"));
  }
  cv.appendChild(txt(305,y+34,label,null,"middle"));
  return x;
}

// 步骤 1: 12 个负对照
function render1(){
  clear();
  const d0=-0.35,d1=0.10,y0=40, ystep=20;
  const x=drawAxis(d0,d1,290,"数值轴 (log 风险比)");
  const nc=DATA.nc_rep1;
  nc.forEach((row,idx)=>{
    const y=y0+idx*ystep;
    const col=row.is_shifted?"var(--orange)":"var(--blue)";
    const px=x(row.nc_log_rr);
    cv.appendChild(txt(20,y+4,row.is_shifted?"违反":"干净","axis-t","end"));
    cv.appendChild(el("line",{x1:x(row.nc_bias_true),y1:y-7,x2:x(row.nc_bias_true),y2:y+7,
      stroke:col,"stroke-dasharray":"2 2",opacity:.55}));
    cv.appendChild(el("line",{x1:x(row.nc_log_rr-row.nc_se),y1:y,x2:x(row.nc_log_rr+row.nc_se),y2:y,
      stroke:col,opacity:.45,"stroke-width":2}));
    const c=el("circle",{cx:px,cy:y,r:4.5,fill:col,class:"pop"});
    c.style.animationDelay=(idx*0.07)+"s";
    cv.appendChild(c);
  });
}

// 步骤 2: fitNull 高斯
function render2(){
  clear();
  const d0=-0.35,d1=0.10,ybase=250;
  const x=drawAxis(d0,d1,290,"数值轴 (log 风险比)");
  const mu=-0.1506, sig=0.0414;
  const path=el("path",{fill:"rgba(46,158,107,.18)",stroke:"var(--green)","stroke-width":2});
  let d="M "+x(d0)+" "+ybase;
  for(let v=d0; v<=d1+1e-9; v+=0.005){
    const f=Math.exp(-((v-mu)**2)/(2*sig*sig));
    const yy=ybase-f*210;
    d+=" L "+x(v).toFixed(1)+" "+yy.toFixed(1);
  }
  d+=" L "+x(d1)+" "+ybase+" Z";
  path.setAttribute("d",d); cv.appendChild(path);
  cv.appendChild(el("line",{x1:x(mu),y1:30,x2:x(mu),y2:ybase,stroke:"var(--green)","stroke-dasharray":"4 3"}));
  cv.appendChild(txt(x(mu),24,"μ_b=−0.1506","axis-t","middle"));
  cv.appendChild(el("line",{x1:x(-0.20),y1:30,x2:x(-0.20),y2:ybase,stroke:"#9fb4c7","stroke-dasharray":"4 3"}));
  cv.appendChild(txt(x(-0.20),24,"真值 −0.20","axis-t","middle"));
  DATA.nc_rep1.forEach(row=>{
    cv.appendChild(el("circle",{cx:x(row.nc_log_rr),cy:ybase-(Math.exp(-((row.nc_log_rr-mu)**2)/(2*sig*sig)))*210,r:3.2,
      fill:row.is_shifted?"var(--orange)":"var(--blue)"}));
  });
}

// 步骤 3: 主研究观测
function render3(){
  clear();
  const d0=-0.65,d1=0.10;
  const x=drawAxis(d0,d1,250,"数值轴 (log 风险比)");
  cv.appendChild(el("circle",{cx:x(-0.1506),cy:120,r:6,fill:"var(--brown)"}));
  cv.appendChild(txt(x(-0.1506),104,"μ_b=−0.1506","axis-t","middle"));
  cv.appendChild(el("circle",{cx:x(-0.4494),cy:120,r:7,fill:"var(--indigo)"}));
  cv.appendChild(txt(x(-0.4494),104,"obs=−0.4494","axis-t","middle"));
  cv.appendChild(el("line",{x1:x(-0.4494),y1:140,x2:x(-0.1506),y2:140,stroke:"#888","stroke-width":2,"marker-end":"url(#ar)"}));
  cv.appendChild(txt(305,175,"obs = ψ + μ_B + N(0,0.06) = −0.50 + 噪声","axis-t","middle"));
  const defs=el("defs",{}); const m=el("marker",{id:"ar",markerWidth:8,markerHeight:8,refX:6,refY:3,orient:"auto"});
  m.appendChild(el("path",{d:"M0,0 L6,3 L0,6 Z",fill:"#888"})); defs.appendChild(m); cv.appendChild(defs);
}

// 步骤 4: BF 分类
function render4(){
  clear();
  cv.appendChild(txt(300,50,"第 1 轮回合的 BF 计算 (主指标)",null,"middle"));
  const lines=[
    "BF_est = |μ_b| / (|μ_b| + |obs − μ_b|)",
    "        = |−0.1506| / (|−0.1506| + |−0.4494 − (−0.1506)|)",
    "        = 0.1506 / (0.1506 + 0.2988)",
    "        = 0.1506 / 0.4494 = 0.335",
    "1/3 ≤ 0.335 ≤ 0.5  →  黄区 (competitive)"
  ];
  let y=95; lines.forEach((s,i)=>{
    cv.appendChild(txt(300,y,s,i===4?"":"mono","middle"));
    y+=30;
  });
  const b=el("rect",{x:250,y:255,width:100,height:34,rx:8,fill:"var(--yellow)"});
  cv.appendChild(b); cv.appendChild(txt(300,278,"黄区 competitive","axis-t","middle"));
}

// 步骤 5: 200 次汇总 (BF 直方图)
function render5(){
  clear();
  const reps=DATA.reps200;
  // 按 BF 分类统计 (cls 已经是 BF 尺度的分类)
  const counts={green:0,yellow:0,red:0};
  reps.forEach(r=>{ if(r.cls==="effect-dominated")counts.green++; else if(r.cls==="competitive")counts.yellow++; else counts.red++; });

  // 左: BF 直方图 (x 轴 0~1, 阈值 1/3 与 0.5)
  cv.appendChild(txt(150,28,"200 个 BF_est 落区分布 (BF 尺度)",null,"middle"));
  const total=200, y0=80, h=170, bw=170;
  const bfMin=0, bfMax=1;
  const bands=[["green",0,1/3,"var(--green)","绿区 <1/3"],["yellow",1/3,0.5,"var(--yellow)","黄区 1/3–0.5"],["red",0.5,1,"var(--red)","红区 >0.5"]];
  bands.forEach(b=>{
    const x0=40+b[1]/bfMax*bw, x1=40+b[2]/bfMax*bw;
    cv.appendChild(el("rect",{x:x0,y:y0,width:x1-x0,height:h,fill:b[3],opacity:.18}));
  });
  // 区名 + BF 阈值图例 (独立行, 比例数交给右图堆叠条)
  const bandText = bands.map(b=>{
    const s={green:"绿",yellow:"黄",red:"红"}[b[0]];
    const label={green:"<1/3",yellow:"1/3–0.5",red:">0.5"}[b[0]];
    return s+"区 "+label;
  }).join("   |   ");
  cv.appendChild(txt(40+bw/2, y0+h+30, bandText, null, "middle"));
  // 真值线 (BF_true = 0.40) + 白底标签,避免与 x 轴刻度重叠
  const xt=40+P.bf_true/bfMax*bw;
  cv.appendChild(el("line",{x1:xt,y1:y0-2,x2:xt,y2:y0+h,stroke:"#1f2d3d","stroke-dasharray":"4 3"}));
  // 白底矩形 (铺在 x 轴刻度上方), 尺寸按字符估宽, 锚点 middle
  cv.appendChild(el("rect",{x:xt-46,y:y0-26,width:92,height:18,fill:"#fbfdff",opacity:.96}));
  cv.appendChild(txt(xt,y0-13,"真值 BF=0.40",null,"middle"));
  // x 轴刻度 (避开真值文字)
  const xticks=[0, 0.25, 0.5, 0.75, 1];
  xticks.forEach(v=>{
    const xp=40+v*bw;
    cv.appendChild(el("line",{x1:xp,y1:y0,x2:xp,y2:y0+4,stroke:"#9fb4c7"}));
    cv.appendChild(txt(xp,y0-4,v.toFixed(2),null,"middle"));
  });

  // 右: 堆叠条 + 辅助信息
  cv.appendChild(txt(490,32,"点估计 vs 真值 (BF 尺度)",null,"middle"));
  cv.appendChild(txt(490,58,"真值: 黄区 (BF=0.40)",null,"middle"));
  const sx=420, sy=78, sh=150, sw=130;
  let yy=sy;
  [["green",counts.green,"绿区"],["yellow",counts.yellow,"黄区"],["red",counts.red,"红区"]].forEach(b=>{
    const hh=b[1]/total*sh;
    cv.appendChild(el("rect",{x:sx,y:yy,width:sw,height:hh,fill:b[0],opacity:.8}));
    cv.appendChild(txt(sx+sw+8,yy+hh/2,(b[2]+" "+b[1]),null,"start"));
    yy+=hh;
  });
  cv.appendChild(txt(sx,sy+sh+20,"200 个回合分类计数",null,"middle"));
  cv.appendChild(txt(490,sy+sh+45,"μ_b 均值=−0.1501 (真值 −0.20)",null,"middle"));
  cv.appendChild(txt(490,sy+sh+65,"被 4 个被违反对照(均值 −0.05) 拉高",null,"middle"));
}

const renderers=[render0,render1,render2,render3,render4,render5];
function render(){
  renderers[step]();
  document.getElementById("stepTxt").innerHTML="<b>步骤 "+(step+1)+"/6 · "+STEPS[step].t+"</b><br>"+STEPS[step].d;
  document.getElementById("dots").innerHTML=STEPS.map((_,i)=>`<span class="dot ${i===step?'on':''}"></span>`).join("");
  document.getElementById("prev").disabled=step===0;
  document.getElementById("next").disabled=step===STEPS.length-1;
}
function go(s){step=Math.max(0,Math.min(STEPS.length-1,s));render();}
function play(){ if(timer)return; document.getElementById("play").textContent="⏸ 暂停";
  timer=setInterval(()=>{ if(step>=STEPS.length-1){stop();return;} go(step+1); },2600); }
function stop(){ if(timer){clearInterval(timer);timer=null;} document.getElementById("play").textContent="▶ 自动播放"; }

document.getElementById("prev").onclick=()=>{stop();go(step-1);};
document.getElementById("next").onclick=()=>{stop();go(step+1);};
document.getElementById("play").onclick=()=>{ timer?stop():play(); };
document.getElementById("reset").onclick=()=>{stop();go(0);};

document.getElementById("chips").innerHTML=chipsHTML();
document.getElementById("foot").innerHTML=
  "数据来自 bias-fraction/analysis/run_sim_worker_v35.R 的真实机制 (种子 cond_seed=551)。本论文以 <b>BF</b> 为主指标、<b>BER</b> 为辅助展示。第1轮负对照与 μ_b=−0.1506、obs=−0.4494、BF_est=0.335 均为真实抽样值。黄区准确率低的来源: μ_b 估计方差 + 违反污染, 非分界线位置问题。";
render();
</script>
